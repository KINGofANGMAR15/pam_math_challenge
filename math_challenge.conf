# /etc/security/math_challenge.conf
# Конфигурация математического челленджа pam_math_challenge.so
# Формат: key = value, комментарии начинаются с '#'.

# Сложность: easy (слож/вычитание до 20),
#            medium (умножение/деление до 12, целые),
#            hard (скобки, многооперандные)
difficulty = medium

# Число попыток ответа в ОДНОЙ сессии входа (1..100)
attempts = 3

# Кулдаун (блокировка) после исчерпания попыток, в секундах. 0 = нет блоков.
cooldown_seconds = 300

# Пользователи без челленджа (через запятую)
exempt_users =

# Каталог состояния (root-only). /run => очищается при перезагрузке.
state_dir = /run/math_challenge

# Когда модуль возвращает PAM_IGNORE вместо PAM_SUCCESS после верного
# ответа. Ставьте true, если в PAM-стеке модуль идёт как "required/optional"
# и вы не хотите, чтобы он расценивался как основной auth-фактор.
ignore_errors = false
